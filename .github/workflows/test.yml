name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONNOUSERSITE: "1"
      XDG_CACHE_HOME: /tmp/polar-ble-cache
      XDG_DATA_HOME: /tmp/polar-ble-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install clean test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,sdk]"
      - name: Verify schema-free package and primary CLI boundary
        run: |
          python -c "import polar_ble_tools"
          polar-ble --version
          polar-ble --help
          test ! -e "$XDG_DATA_HOME/polar-ble-tools"
          test ! -e "$XDG_CACHE_HOME/polar-ble-tools"
      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run SDK-free unit and contract tests
        run: python -m pytest -q tests/unit tests/contracts
      - name: Verify opt-in live tests skip outside protected hardware
        run: python -m pytest -q tests/live

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install clean portability environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Verify platform-neutral import and CLI construction
        run: |
          python -c "import polar_ble_tools"
          polar-ble --version
          polar-ble --help
          polar-ble discover --help
          polar-ble prepare --help
          polar-ble connect --help
      - name: Run injected lifecycle portability contracts
        run: >-
          python -m pytest -q
          tests/unit/test_bleak_backend.py
          tests/unit/test_ble_operations.py
          tests/unit/test_device.py
          tests/unit/test_inventory.py
          tests/unit/test_lifecycle_cli.py
          tests/unit/test_package_import.py
          tests/unit/test_primary_cli.py
          tests/unit/test_public_api.py
      - name: Build portable distributions
        run: python -m build

  bleak-endpoints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bleak-version: ["1.0.0", "3.0.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Bleak endpoint
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "bleak==${{ matrix.bleak-version }}"
      - name: Run injected Bleak lifecycle contracts
        run: >-
          python -m pytest -q
          tests/unit/test_bleak_backend.py
          tests/unit/test_ble_operations.py
          tests/unit/test_bluez_agent.py
          tests/unit/test_device.py
          tests/unit/test_workflows.py
