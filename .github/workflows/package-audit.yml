name: package-audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Scan tracked source and repository history
        run: python scripts/release_audit.py
      - name: Build, inspect, and smoke-test distributions
        run: python -m pytest -q tests/packaging/test_artifacts.py
