name: testpypi-candidate

on:
  push:
    tags: ["v*rc*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,sdk]"
          ruff check .
          ruff format --check .
          python -m pytest -q tests/unit tests/contracts/test_protocol_contracts.py
  package-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python scripts/release_audit.py
          python -m pytest -q tests/packaging/test_artifacts.py
  sdk-contract:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: /tmp/polar-ble-sdk-cache
      XDG_DATA_HOME: /tmp/polar-ble-sdk-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,sdk]"
          polar-ble sdk install --accept-license
          test "$(polar-ble sdk status | sed -n 's/^active: //p')" = ccff6812c40fff1753c72385387d1877ca9b27b4
          python -m pytest -q tests/sdk_contract tests/contracts
      - if: always()
        run: |
          polar-ble sdk remove --all
          test ! -e "$XDG_DATA_HOME/polar-ble-tools/sdk/polar"
          test ! -e "$XDG_DATA_HOME/polar-ble-tools/generated/polar"
          test ! -e "$XDG_DATA_HOME/polar-ble-tools/active-sdk.json"
  build:
    needs: [ordinary, package-audit, sdk-contract]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - id: version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  smoke-testpypi:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: /tmp/polar-ble-sdk-cache
      XDG_DATA_HOME: /tmp/polar-ble-sdk-data
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "polar-ble-tools==${{ needs.build.outputs.version }}"
          polar-ble --version
          polar-ble --help
          polar-ble raw --help
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "polar-ble-tools[sdk]==${{ needs.build.outputs.version }}"
          polar-ble doctor
          polar-ble bpb --help
