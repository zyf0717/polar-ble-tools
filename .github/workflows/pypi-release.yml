name: pypi-release

on:
  push:
    tags:
      - "v*"
      - "!v*rc*"

permissions:
  contents: read
  actions: read

jobs:
  validate-tag-and-candidate:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          project_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject.toml project.version must be a stable semantic version; found: $project_version" >&2
            exit 1
          fi
          expected_tag="v$project_version"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version; expected $expected_tag." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tagged_commit="$(
            git ls-remote --tags origin "${tag_ref}^{}" \
              | awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }'
          )"
          if [ -z "$tagged_commit" ]; then
            echo "Release tag $GITHUB_REF_NAME is not an annotated tag on origin." >&2
            exit 1
          fi
          if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
            echo "Annotated tag $GITHUB_REF_NAME resolves to $tagged_commit, not workflow commit $GITHUB_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "Tagged commit $tagged_commit is not contained in origin/main." >&2
            exit 1
          fi

          run_id="$(
            gh run list \
              --workflow testpypi-candidate.yml \
              --commit "$GITHUB_SHA" \
              --event workflow_dispatch \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No successful manually dispatched TestPyPI candidate run exists for commit $GITHUB_SHA." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
  promote-and-compare:
    needs: validate-tag-and-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download successful TestPyPI candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.validate-tag-and-candidate.outputs.run_id }}
        run: |
          mkdir -p dist
          gh run download "$RUN_ID" \
            --name "distributions-${GITHUB_SHA}" \
            --dir dist
      - name: Validate promoted distributions
        run: |
          python -m pip install --upgrade pip twine
          python - <<'PY'
          from pathlib import Path

          artifacts = [path for path in Path("dist").iterdir() if path.is_file()]
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          if len(artifacts) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found: {artifacts}")
          PY
          python -m twine check --strict dist/*
      - name: Verify promoted distributions against TestPyPI
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tomllib, urllib.request

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          with urllib.request.urlopen(f"https://test.pypi.org/pypi/polar-ble-tools/{version}/json") as response:
              testpypi = json.load(response)
          published = {
              item["filename"]: item["digests"]["sha256"]
              for item in testpypi["urls"]
              if item["filename"].endswith((".whl", ".tar.gz"))
          }
          local = {artifact.name for artifact in pathlib.Path("dist").iterdir() if artifact.is_file()}
          if local != set(published):
              raise SystemExit(f"local artifacts {sorted(local)} do not match TestPyPI {sorted(published)}")
          for artifact in pathlib.Path("dist").iterdir():
              if not artifact.is_file():
                  continue
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              if published.get(artifact.name) != digest:
                  raise SystemExit(f"TestPyPI digest mismatch: {artifact.name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish-pypi:
    needs: promote-and-compare
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-distributions-${{ github.sha }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
